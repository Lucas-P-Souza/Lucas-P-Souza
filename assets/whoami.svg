<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="820" height="290" viewBox="0 0 820 290" role="img" aria-label="Terminal: whoami and about">
  <style>
    .mono { white-space: pre; font-family: 'JetBrains Mono','Fira Code','SF Mono',Consolas,'DejaVu Sans Mono',monospace; font-size: 17px; }
    .prompt { fill: #34d399; }
    .cmd { fill: #f1f5f9; }
    .key { fill: #22d3ee; }
    .val { fill: #e2e8f0; }
    .dim { fill: #64748b; }
    .accent { fill: #a5f3fc; font-weight: 700; }
    .line { opacity: 0; animation: show 0.01s forwards; }
    .l1 { animation-delay: 0.4s; } .l2 { animation-delay: 1.1s; } .l3 { animation-delay: 1.7s; }
    .l4 { animation-delay: 2.2s; } .l5 { animation-delay: 2.7s; } .l6 { animation-delay: 3.2s; }
    .l7 { animation-delay: 3.9s; }
    .cursor { animation: blink 1s steps(1) infinite; animation-delay: 3.9s; opacity: 0; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
  <rect x="1" y="1" width="818" height="288" rx="14" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
  <path d="M1 15a14 14 0 0 1 14-14h790a14 14 0 0 1 14 14v26H1z" fill="#111827"/>
  <circle cx="26" cy="21" r="6" fill="#ef4444" opacity="0.85"/>
  <circle cx="48" cy="21" r="6" fill="#eab308" opacity="0.85"/>
  <circle cx="70" cy="21" r="6" fill="#22c55e" opacity="0.85"/>
  <text x="410" y="26" text-anchor="middle" class="mono dim" style="font-size:13px">lucas@brest: ~</text>

  <g class="mono">
    <g class="line l1"><text x="28" y="76"><tspan class="prompt">lucas@brest</tspan><tspan class="dim">:</tspan><tspan class="key">~</tspan><tspan class="dim">$ </tspan><tspan class="cmd">whoami</tspan></text></g>
    <g class="line l2"><text x="28" y="104" class="accent" style="font-size:20px">Lucas de Paula Souza</text></g>

    <g class="line l3"><text x="28" y="140"><tspan class="prompt">lucas@brest</tspan><tspan class="dim">:</tspan><tspan class="key">~</tspan><tspan class="dim">$ </tspan><tspan class="cmd">cat about.txt</tspan></text></g>

    <g class="line l4"><text x="28" y="172"><tspan class="key">studying    </tspan><tspan class="dim">→ </tspan><tspan class="val">Engineering diploma @ ENIB (BRAFITEC with UNIFEI)</tspan></text></g>
    <g class="line l4"><text x="28" y="194"><tspan class="key">            </tspan><tspan class="dim">→ </tspan><tspan class="val">Master 2 SIIA, Interactive &amp; Autonomous Systems</tspan></text></g>
    <g class="line l5"><text x="28" y="222"><tspan class="key">focus       </tspan><tspan class="dim">→ </tspan><tspan class="val">LLM evaluation · RAG · multi-agent · embedded C/C++</tspan></text></g>
    <g class="line l6"><text x="28" y="250"><tspan class="key">looking for </tspan><tspan class="dim">→ </tspan><tspan class="val">6-month internship, starting 2027-02-22</tspan></text></g>

    <g class="line l7"><text x="28" y="278"><tspan class="prompt">lucas@brest</tspan><tspan class="dim">:</tspan><tspan class="key">~</tspan><tspan class="dim">$ </tspan></text></g>
    <rect class="cursor" x="182" y="264" width="10" height="17" fill="#22d3ee"/>
  </g>
</svg>
